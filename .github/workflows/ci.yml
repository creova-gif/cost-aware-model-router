name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and verify
        run: |
          pip install -e ".[dev]"
          ruff check src tests
          mypy --strict src tests
          pytest -v
          cost-router --version
          cost-router demo --out ./artifacts/ci-demo
          cost-router verify-receipt ./artifacts/ci-demo/savings-receipt.json
          cost-router simulate-thermostat --out ./artifacts/ci-demo/thermostat
          cost-router audit-holdout --out ./artifacts/ci-demo/holdout
          cost-router train-bandit --epochs 2 --out ./artifacts/ci-demo/bandit
      - uses: actions/upload-artifact@v7
        with:
          name: milestone-1-pareto-demo
          path: ./artifacts/ci-demo/
